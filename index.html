<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1d21">
  <meta name="description" content="Base layout planner and calculator for Post Apo Tycoon.">
  <title>Post Apo Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button id="btnPlans" class="plan-name" title="Plans">
      <span id="planName">Plan</span><span class="caret">▾</span>
    </button>
    <span id="planSize" class="muted small"></span>
    <div class="spacer"></div>
    <button id="btnUndo" class="icon" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
    <button id="btnRedo" class="icon" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
    <button id="btnFit" class="icon" title="Fit to screen (F)" aria-label="Fit to screen">⤢</button>
    <button id="btnMenu" class="icon" title="Menu" aria-label="Menu">☰</button>
  </header>

  <main class="layout">
    <section id="stage" class="stage">
      <canvas id="canvas"></canvas>
      <div id="hud" class="hud"></div>
      <div id="toast" class="toast" hidden></div>
    </section>

    <aside id="panel" class="panel">
      <div class="panel-handle" id="panelHandle"><span></span></div>
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="palette">Palette</button>
        <button class="tab" data-tab="stats">Totals</button>
        <button class="tab" data-tab="info">Inspect</button>
      </nav>
      <div class="tab-body" id="tab-palette">
        <div class="seg" id="palKind">
          <button data-kind="building" class="active">Buildings</button>
          <button data-kind="terrain">Terrain</button>
        </div>
        <div class="pal-filters">
          <input id="palSearch" type="search" placeholder="Search…" autocomplete="off">
          <label class="lvl" title="Your Main Settlement level">Lv <input id="palLevel" type="number" min="1" max="999" inputmode="numeric"></label>
          <label class="chk" title="Hide buildings above your level"><input id="palHideLocked" type="checkbox"> hide locked</label>
        </div>
        <div id="palList" class="pal-list"></div>
      </div>
      <div class="tab-body" id="tab-stats" hidden></div>
      <div class="tab-body" id="tab-info" hidden></div>
    </aside>
  </main>

  <footer class="toolbar">
    <div class="tools" id="tools">
      <button data-tool="pan" title="Pan / move (H)"><b>✋</b><i>Pan</i></button>
      <button data-tool="build" title="Place building (B)"><b>🏗</b><i>Build</i></button>
      <button data-tool="terrain" title="Paint terrain (T)"><b>🟩</b><i>Terrain</i></button>
      <button data-tool="pave" title="Toggle pavement (P)"><b>▦</b><i>Pave</i></button>
      <button data-tool="erase" title="Erase building (E)"><b>⌫</b><i>Erase</i></button>
      <button data-tool="inspect" title="Inspect (I)"><b>🔍</b><i>Inspect</i></button>
    </div>
    <div class="toolopts">
      <button id="btnRect" class="toggle" title="Rectangle fill (R)"><b>▭</b><i>Rect</i></button>
      <button id="btnCurrent" class="current" title="Pick from palette">
        <span id="curSwatch" class="swatch"></span><span id="curName">—</span>
      </button>
      <button id="btnPanel" class="panel-toggle" title="Show / hide panel"><b>☷</b><i>Panel</i></button>
    </div>
  </footer>

  <input id="fileImport" type="file" accept=".json,application/json" hidden>
  <script type="module" src="js/app.js"></script>
</body>
</html>
